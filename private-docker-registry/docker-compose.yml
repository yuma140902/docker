version: '3.8'

services:
  registry:
    image: registry:latest@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    container_name: registry
    restart: always
    hostname: registry
    ports:
      - '5000:5000'
    volumes:
      - './registry:/var/lib/registry'
  registry-frontend:
    image: konradkleine/docker-registry-frontend:v2@sha256:60d4b91e68fa87d28fe6100758ab5d57b26a0cafdf89e68908a2b6bbf912fca5
    container_name: registry-frontend
    restart: always
    hostname: registry-frontend
    environment:
      ENV_DOCKER_REGISTRY_HOST: registry
      ENV_DOCKER_REGISTRY_PORT: 5000
    ports:
      - 8080:80
    volumes:
      - ./scripts:/scripts
    command: /scripts/issue-159-workaround.sh
